<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worming Around</title>
    <link rel="canonical" href="https://connorjbryant.github.io/worming-around">
    <link rel="manifest" href="/worming-around/manifest.webmanifest">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="rotate-warning">
        <p>Please rotate your device to landscape to play!</p>
    </div>
    <canvas id="three-canvas"></canvas>

    <div id="ui">
        <!-- Game HUD: Hidden until the game starts -->
         <div id="hud" style="display: none;">
            <p>SCORE: <span id="msg">0</span></p>
         </div>

        <!-- Start overlay -->
        <div id="start-screen">
            <h1>Game</h1>
            <p id="high-score-display">High Score: 0</p>
            <button id="startBtn">Start</button>
        </div>
    </div>

    <div id="game-blueprint">
        <main>
            <ul id="root">
                <li id="start">
                    <div class="player-worm js-player"></div>
                </li>
                <li>
                    <div class="player-friend js-friend"></div>
                </li>
                <li>
                    <ul id="game"></ul>
                </li>
            </ul>
        </main>
    </div>
        
    <script>
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register (
                '/worming-around/sw.js',
                {scope: '/worming-around/'}
            )
        }
    </script>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/jquery.mobile-events.min.js"></script>
    <script src="js/three.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
